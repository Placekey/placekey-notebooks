# Dependency manifest and tool configuration.
#
# `[project] dependencies` below is the complete declaration of what this
# repository needs, and `pip install .` is the whole install — here, on a
# developer's machine, and in CI. There is deliberately NO lockfile.
#
# That is a decision, not an omission: a lockfile is one resolve for one
# interpreter on one operating system, and these are tutorial notebooks meant
# to keep working against current releases rather than a deployed artifact
# needing a reproducible build.
#
# The control is the exact `==` pins below plus CI: Dependabot proposes each
# bump as its own pull request and the notebook run decides whether it lands.
# This covers the RUNTIME dependencies only. The tools that run CI itself --
# nbmake, pytest, ruff, codespell, nbformat, pip-audit -- are bounded ranges
# inside workflow `run:` blocks, where Dependabot cannot see them and where
# they float to the newest release in range on every run. Pinning them is the
# right end state and is not done here.
# That only holds while the version CI tests is the version in the diff, and
# the notebooks themselves threaten it — each one opens with its own
# `!pip install 'placekey>=0.0.9,<1.0'` for readers on a fresh Colab runtime,
# which would re-resolve over the top of these pins. notebook-ci.yml exports
# PIP_CONSTRAINT pointing at a `pip freeze` of the environment it just
# installed, so those lines can only land on what is already there, and it
# diffs a second freeze afterwards to prove nothing moved. The freeze covers
# every resolved distribution, not just the twelve named here — a constraints
# file binds only the names it contains.
#
# tests/test_notebook_pins_agree.py guards the other direction: a pin that no
# longer satisfies a notebook's own range makes pip refuse the install, and
# IPython's `!` does not raise, so the cell would pass green having installed
# nothing. Widening a pin past one of those ranges means widening the notebook
# in the same pull request.

[project]
# This repository ships notebooks, not a distribution — nothing here is built,
# published to an index or imported as a package. `name` and `version` exist
# only because `[project]` requires them; they are not a release identity, they
# are never bumped, and nothing consumes them.
name = "placekey-notebooks"
version = "0"
description = "Dependency manifest for the Placekey tutorial notebooks (not a published package)."
# CI runs 3.11 and 3.12, and [tool.ruff] targets py311.
requires-python = ">=3.11"
dependencies = [
  "placekey==0.0.36",
  "pandas==2.3.3",
  "numpy==2.4.4",
  "shapely==2.1.2",
  "geopandas==1.1.3",
  "folium==0.20.0",
  "h3==4.4.2", # placekey>=0.0.36 requires h3 v4

  # Notebook runtime
  "jupyter==1.1.1",
  "jupyterlab==4.5.6",
  "ipykernel==6.31.0",

  # Data fetching for sample notebooks
  "awscli==1.44.84",

  # Secure local-key handling
  "python-dotenv==1.2.2",
]

# Build-system requires are NOT read by Dependabot's pip ecosystem, so these
# two lines are bumped by hand. 84.0.0 rather than the current 84.2.1: this
# repository's Dependabot cooldown is 21 days and 84.2.1 was published
# 2026-10-20, so hand-picking it now would be the one thing that policy exists
# to prevent. `wheel` is gone from the list because setuptools has built
# wheels natively since 70.1 and no longer needs it declared.
[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

# Nothing is packaged from this repository. Stating an empty module list turns
# setuptools' flat-layout auto-discovery off, which would otherwise refuse to
# build at all ("multiple top-level packages discovered": data, docs, notebooks,
# tests). This is what makes `pip install .` — the one install path — resolve
# the dependencies above and install no code.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "data", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501", # line too long — notebooks often have wide cells
    "E402", # module-level import not at top (cells commonly import mid-notebook)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
# Tutorial notebooks are demonstrative code, not production.
# Accept legacy style so CI catches real bugs, not cosmetic drift.
"notebooks/**/*.ipynb" = [
    "I001",   # unsorted imports
    "UP030",  # positional-format indices
    "UP032",  # legacy .format() over f-strings
    "W291",   # trailing whitespace
    "W293",   # blank-line whitespace
    "B006",   # mutable default arg
    "B905",   # zip without strict=
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.codespell]
skip = "*.ipynb_checkpoints,data,docs,*.svg,LICENSE,./.git,*.html"
# Skip base64-encoded data URLs (embedded images in tutorial notebooks) — they
# contain random byte sequences that trigger false positives.
ignore-regex = "data:image/[a-z]+;base64,[A-Za-z0-9+/=]+"
# Genuine false positives in prose/code.
ignore-words-list = "nd,te,ba,ND,hist,sxl"
