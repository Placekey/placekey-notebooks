version: 2
updates:
  # Python deps. `directory: "/"` is where pyproject.toml lives; its
  # `[project] dependencies` ranges are the only manifest. There is no
  # lockfile, and Dependabot's `pip` ecosystem reads a PEP 621 pyproject.toml
  # directly.
  #
  # The `ignore:` block caps major bumps at the same bounds that
  # pyproject.toml's `[project] dependencies` declare, so Dependabot won't even
  # open PRs for capped majors; a human must raise the cap intentionally to
  # take one (edit pyproject.toml + this file, then regenerate the lockfile).
  - package-ecosystem: "pip"
    assignees:
      - "kernelsam"
    cooldown:
      default-days: 21
    directory: "/"
    # Daily is a deliberate security standard: a vulnerable transitive should
    # surface the day it is published, not up to a week later.
    schedule:
      interval: "daily"
      time: "13:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      jupyter:
        patterns:
          - "jupyter*"
          - "ipykernel"
          - "ipywidgets"
          - "nbconvert"
          - "nbformat"
      geospatial:
        patterns:
          - "shapely"
          - "geopandas"
          - "folium"
          - "h3"
          - "pyproj"
          - "fiona"
      aws:
        patterns:
          - "awscli"
          - "boto*"
          - "botocore"
          - "s3transfer"
    commit-message:
      prefix: "deps(python):"
    # Major-version caps. Mirror the upper bounds in pyproject.toml's
    # `[project] dependencies`; when bumping a cap, update both files. folium
    # is intentionally uncapped (it has been 0.x for a decade and its eventual
    # 1.0 is expected to be non-breaking).
    ignore:
      - dependency-name: "placekey"
        versions: [">=1.0"]
      - dependency-name: "pandas"
        versions: [">=3.0"]
      - dependency-name: "numpy"
        versions: [">=3.0"]
      - dependency-name: "shapely"
        versions: [">=3.0"]
      - dependency-name: "geopandas"
        versions: [">=2.0"]
      - dependency-name: "h3"
        versions: [">=5.0"]
      - dependency-name: "jupyter"
        versions: [">=2.0"]
      - dependency-name: "jupyterlab"
        versions: [">=5.0"]
      - dependency-name: "ipykernel"
        versions: [">=7.0"]
      - dependency-name: "awscli"
        versions: [">=3.0"]
      - dependency-name: "python-dotenv"
        versions: [">=2.0"]

  # GitHub Actions workflow versions. Actions are pinned by commit SHA with
  # version tag as a trailing comment; Dependabot updates both together.
  # senzing-factory/* is excluded from the cooldown: those are first-party and
  # a fix there is meant to reach consumers without waiting three weeks.
  - package-ecosystem: "github-actions"
    assignees:
      - "kernelsam"
    cooldown:
      default-days: 21
      exclude:
        - "senzing-factory/*"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:15"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      senzing-factory:
        patterns:
          - "senzing-factory/*"
    commit-message:
      prefix: "deps(actions):"
    allow:
      - dependency-type: "direct"
