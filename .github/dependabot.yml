version: 2
updates:
  # Python deps. `directory: "/"` is where pyproject.toml lives; its
  # `[project] dependencies` ranges are the only manifest. There is no
  # lockfile, and Dependabot's `pip` ecosystem reads a PEP 621 pyproject.toml
  # directly.
  #
  # Scope note: this ecosystem sees `[project] dependencies` and nothing else.
  # `[build-system] requires` is bumped by hand, and the CI tool versions
  # (nbmake, pytest, ruff, codespell, nbformat, pip-audit) live in workflow
  # `run:` blocks where nothing proposes them. Pinning those is open work.
  #
  # No `ignore:` block, deliberately. `[project] dependencies` in
  # pyproject.toml pins every package with `==`, matching template-python --
  # that is what gives Dependabot something to propose. A `>=` range with no
  # upper bound would be satisfied by every future release, so Dependabot
  # would have nothing to edit and would open nothing at all.
  #
  # Ranges with caps were the previous shape and were removed 2026-11-06. A
  # cap blocks an update on the GUESS that it breaks; an exact pin lets
  # Dependabot propose the bump and lets CI establish whether it does.
  # notebook-ci.yml executes the notebooks and tests.yml runs pytest, so a
  # major that breaks us goes red on its own evidence. The old caps only hid
  # that signal and left pull requests stuck against bounds nobody revisited.
  - package-ecosystem: "pip"
    assignees:
      - "kernelsam"
    cooldown:
      default-days: 21
    directory: "/"
    # Daily is a deliberate security standard: a vulnerable transitive should
    # surface the day it is published, not up to a week later.
    schedule:
      interval: "daily"
      time: "13:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      jupyter:
        patterns:
          - "jupyter*"
          - "ipykernel"
          - "ipywidgets"
          - "nbconvert"
          - "nbformat"
      geospatial:
        patterns:
          - "shapely"
          - "geopandas"
          - "folium"
          - "h3"
          - "pyproj"
          - "fiona"
      aws:
        patterns:
          - "awscli"
          - "boto*"
          - "botocore"
          - "s3transfer"
    commit-message:
      prefix: "deps(python):"
    # No `ignore:` block and no version caps: `[project] dependencies` pins
    # every package with `==`, so each bump arrives as its own pull request
    # and the notebook run decides whether it lands. A cap here would suppress
    # the proposal instead, which is the thing that used to hide work.

  # GitHub Actions workflow versions. Actions are pinned by commit SHA with
  # version tag as a trailing comment; Dependabot updates both together.
  # senzing-factory/* is excluded from the cooldown: those are first-party and
  # a fix there is meant to reach consumers without waiting three weeks.
  - package-ecosystem: "github-actions"
    assignees:
      - "kernelsam"
    cooldown:
      default-days: 21
      exclude:
        - "senzing-factory/*"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:15"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      senzing-factory:
        patterns:
          - "senzing-factory/*"
    commit-message:
      prefix: "deps(actions):"
    allow:
      - dependency-type: "direct"
