name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 14 * * 1"  # weekly Monday 14:00 UTC — catch upstream dep drift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6,<1.0" "codespell>=2.3,<3.0" "nbformat>=5.10,<6.0"

      - name: Ruff (python + notebook cells)
        run: ruff check .

      - name: nbformat validate
        run: |
          python - <<'PY'
          import pathlib, sys, nbformat
          errors = []
          nbs = sorted(pathlib.Path("notebooks").glob("*.ipynb"))
          for nb in nbs:
              try:
                  nbformat.validate(nbformat.read(nb, as_version=4))
              except Exception as e:
                  errors.append(f"{nb}: {e}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"OK — validated {len(nbs)} notebook(s)")
          PY

      - name: codespell
        run: codespell

      - name: actionlint
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2

  lockfile:
    # Ensures requirements.txt is the deterministic `uv pip compile` output of
    # requirements.in. Using uv's --universal mode so the file is
    # cross-platform (platform-specific deps like appnope get marker-gated
    # rather than platform-pinned), avoiding false drift between macOS devs
    # and Linux CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv (pinned)
        run: |
          curl -LsSf https://astral.sh/uv/0.10.7/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Regenerate lockfile in a scratch tree and diff
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          cp requirements.in "$scratch/"
          (cd "$scratch" && uv pip compile \
              --universal \
              --python-version 3.11 \
              --generate-hashes \
              --output-file=requirements.txt \
              requirements.in)
          if ! diff -u requirements.txt "$scratch/requirements.txt"; then
            echo "::error::requirements.txt is out of sync with requirements.in."
            echo "Regenerate with:"
            echo "  uv pip compile --universal --python-version 3.11 --generate-hashes \\"
            echo "    --output-file=requirements.txt requirements.in"
            exit 1
          fi

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.0,<9.0"

      - name: Run smoke + data-integrity tests
        run: pytest
