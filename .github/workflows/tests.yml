name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 14 * * 1"  # weekly Monday 14:00 UTC — catch upstream dep drift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6,<1.0" "codespell>=2.3,<3.0" "nbformat>=5.10,<6.0"

      - name: Ruff (python + notebook cells)
        run: ruff check .

      - name: nbformat validate
        run: |
          python - <<'PY'
          import pathlib, sys, nbformat
          errors = []
          nbs = sorted(pathlib.Path("notebooks").glob("*.ipynb"))
          for nb in nbs:
              try:
                  nbformat.validate(nbformat.read(nb, as_version=4))
              except Exception as e:
                  errors.append(f"{nb}: {e}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"OK — validated {len(nbs)} notebook(s)")
          PY

      - name: codespell
        run: codespell

      - name: actionlint
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2

  lockfile:
    # Ensures requirements.txt is the deterministic pip-compile output of
    # requirements.in. Catches: edits to .in without regenerating .txt, or
    # hand-edits to .txt that pip-compile would not reproduce.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"  # matches the Python used to generate requirements.txt

      - name: Install pip-tools (pinned)
        run: pip install "pip-tools==7.5.3"

      - name: Regenerate lockfile in a scratch tree and diff
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          # Copy BOTH files so pip-compile uses the committed lockfile as an
          # existing-pin source. Without this it fetches latest from PyPI on
          # every CI run and fails spuriously whenever any transitive dep
          # publishes a new release.
          cp requirements.in requirements.txt "$scratch/"
          (cd "$scratch" && pip-compile \
              --quiet \
              --generate-hashes \
              --resolver=backtracking \
              --allow-unsafe \
              --output-file=requirements.txt \
              requirements.in)
          if ! diff -u requirements.txt "$scratch/requirements.txt"; then
            echo "::error::requirements.txt is out of sync with requirements.in."
            echo "Regenerate with:"
            echo "  pip-compile --generate-hashes --resolver=backtracking --allow-unsafe \\"
            echo "    --output-file=requirements.txt requirements.in"
            exit 1
          fi

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.0,<9.0"

      - name: Run smoke + data-integrity tests
        run: pytest
