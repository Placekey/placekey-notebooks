name: notebook-ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 16 * * 1"  # weekly Monday 16:00 UTC — catch dep drift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  execute-keyfree-notebooks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "nbmake>=1.5,<2.0" "pytest>=8.0,<9.0"

      - name: Execute API-key-free notebooks with nbmake
        run: |
          pytest --nbmake --nbmake-timeout=600 \
            notebooks/basic_functionality.ipynb \
            notebooks/advanced_functionality.ipynb
