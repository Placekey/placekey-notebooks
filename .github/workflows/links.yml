name: links

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.ipynb"
      - .github/workflows/links.yml
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.ipynb"
      - .github/workflows/links.yml
  schedule:
    - cron: "0 15 * * 1"  # weekly Monday 15:00 UTC — catch link rot
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 4
            --max-retries 3
            --retry-wait-time 10
            --timeout 30
            --accept 200,206,403,429
            --exclude-path docs
            'README.md'
            'notebooks/**/*.ipynb'
          fail: true
