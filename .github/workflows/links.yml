name: links

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.ipynb"
      - .github/workflows/links.yml
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.ipynb"
      - .github/workflows/links.yml
  schedule:
    - cron: "0 15 * * 1"  # weekly Monday 15:00 UTC — catch link rot
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 4
            --max-retries 3
            --retry-wait-time 10
            --timeout 30
            --accept 200,206,403,429
            --exclude-path docs
            'README.md'
            'notebooks/**/*.ipynb'
          fail: true
