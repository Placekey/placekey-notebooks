name: deps-audit

on:
  push:
    branches: [main]
    paths:
      - requirements.txt
      - requirements.in
      - .github/workflows/deps-audit.yml
  pull_request:
    paths:
      - requirements.txt
      - requirements.in
      - .github/workflows/deps-audit.yml
  schedule:
    - cron: "0 13 * * 1"  # weekly Monday 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    # Non-blocking on scheduled runs so a freshly-disclosed CVE with no upstream
    # fix doesn't redden `main`. PR/push runs still block so we notice drift.
    continue-on-error: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit>=2.7,<3.0"

      - name: Audit pinned dependencies
        run: pip-audit -r requirements.txt --disable-pip
