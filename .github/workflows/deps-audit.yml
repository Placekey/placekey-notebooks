name: deps-audit

on:
  push:
    branches: [main]
    paths:
      - requirements.txt
      - requirements.in
      - .github/workflows/deps-audit.yml
  pull_request:
    paths:
      - requirements.txt
      - requirements.in
      - .github/workflows/deps-audit.yml
  schedule:
    - cron: "0 13 * * 1"  # weekly Monday 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    # Non-blocking on scheduled runs so a freshly-disclosed CVE with no upstream
    # fix doesn't redden `main`. PR/push runs still block so we notice drift.
    continue-on-error: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit>=2.7,<3.0"

      - name: Audit pinned dependencies
        run: pip-audit -r requirements.txt --disable-pip
