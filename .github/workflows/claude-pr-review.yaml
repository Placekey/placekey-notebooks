name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # Pinned to an exact tag, not the floating @v4, deliberately: v4 is parked
    # on the rolled-back 4.5.1 and 4.8.1 is the release under test, which has
    # to be exercised on real pull requests before the major tag moves.
    uses: senzing-factory/build-resources/.github/workflows/claude-pull-request-review.yaml@4.8.1
    permissions:
      contents: read
      pull-requests: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
